<base-dialog
  [visible]="visible()"
  [header]="
    location()
      ? 'preferences.location.edit_title'
      : 'preferences.location.create_title'
  "
  size="lg"
  [loading]="saving()"
  [saveDisabled]="!locationForm.valid"
  (save)="onSave()"
  (hide)="hide.emit()"
>
  <div class="grid grid-cols-12 gap-4">
    <!-- Left column: Facility, Zone, Category, Type -->
    <div class="col-span-12 md:col-span-6 flex flex-col gap-4">
      <!-- Facility -->
      <base-form-field
        type="dropdown"
        label="labels.facility"
        [control]="locationForm.controls.facility_id"
        [options]="facilityOptions"
        optionLabel="label"
        optionValue="value"
        [required]="true"
      />

      <!-- Zone with inline add (disabled until facility selected) -->
      <div class="flex flex-col gap-1">
        <div class="flex items-end gap-2">
          <div class="flex-1">
            <base-form-field
              type="dropdown"
              label="preferences.location.zone"
              [control]="locationForm.controls.zone_id"
              [options]="zoneOptions"
              optionLabel="label"
              optionValue="value"
            />
          </div>
          <p-button
            icon="pi pi-plus"
            [outlined]="true"
            severity="secondary"
            (onClick)="toggleZoneForm()"
            [disabled]="isZoneDisabled"
            [style]="{ 'min-width': '2.5rem', height: '2.5rem' }"
          />
        </div>

        <!-- Inline zone creation panel -->
        @if (showZoneForm) {
          <div
            class="p-3 mt-1 rounded-lg border border-surface-200 dark:border-surface-700 bg-surface-50 dark:bg-surface-800"
          >
            <div class="grid grid-cols-2 gap-3 mb-3">
              <div class="flex flex-col gap-1">
                <label for="loc-form-zone-name" class="text-sm font-semibold">
                  {{ 'preferences.location.zone_name' | translate }}
                  <span class="text-red-500">*</span>
                </label>
                <input
                  id="loc-form-zone-name"
                  pInputText
                  [formControl]="zoneForm.controls.zone_name"
                  [placeholder]="
                    'preferences.location.zone_name_placeholder' | translate
                  "
                  class="w-full"
                />
              </div>
              <div class="flex flex-col gap-1">
                <label for="loc-form-zone-description" class="text-sm font-semibold">
                  {{ 'preferences.location.zone_description' | translate }}
                </label>
                <input
                  id="loc-form-zone-description"
                  pInputText
                  [formControl]="zoneForm.controls.zone_type"
                  [placeholder]="
                    'preferences.location.zone_description_placeholder'
                      | translate
                  "
                  class="w-full"
                />
              </div>
            </div>
            <div class="flex justify-end gap-2">
              <p-button
                [label]="'buttons.cancel' | translate"
                severity="secondary"
                [text]="true"
                size="small"
                (onClick)="cancelZoneForm()"
              />
              <p-button
                [label]="'buttons.save' | translate"
                size="small"
                [disabled]="!zoneForm.valid"
                [loading]="savingZone()"
                (onClick)="saveZone()"
              />
            </div>
          </div>
        }
      </div>

      <!-- Category -->
      <base-form-field
        type="dropdown"
        label="preferences.location.category"
        [control]="locationForm.controls.operational_category_code"
        [options]="opCategoryOptions"
        optionLabel="label"
        optionValue="value"
        [required]="true"
      />

      <!-- Type / Profile -->
      <base-form-field
        type="dropdown"
        label="preferences.location.type"
        [control]="locationForm.controls.location_profile_code"
        [options]="profileOptions"
        optionLabel="label"
        optionValue="value"
        [required]="true"
      />
    </div>

    <!-- Right column: Custom name, Area, Row, Bay, Level, Storage Name -->
    <div class="col-span-12 md:col-span-6 flex flex-col gap-4">
      <!-- Custom name toggle -->
      <div class="flex items-center gap-2">
        <span class="text-sm font-semibold">
          {{ 'preferences.location.custom_name' | translate }}
        </span>
        <p-toggleswitch [formControl]="locationForm.controls.custom_name" />
      </div>

      @if (!locationForm.controls.custom_name.value) {
        <!-- Area / Row -->
        <div class="grid grid-cols-2 gap-3">
          <base-form-field
            type="text"
            label="labels.area"
            [control]="locationForm.controls.aisle"
            [required]="true"
          />
          <base-form-field
            type="number"
            label="labels.row"
            [control]="locationForm.controls.row"
            [required]="true"
            [showButtons]="true"
            [min]="0"
          />
        </div>

        <!-- Bay / Level -->
        <div class="grid grid-cols-2 gap-3">
          <base-form-field
            type="number"
            label="labels.bay"
            [control]="locationForm.controls.bay"
            [required]="true"
            [showButtons]="true"
            [min]="0"
          />
          <base-form-field
            type="dropdown"
            label="labels.level"
            [control]="locationForm.controls.level"
            [options]="levelOptions"
            optionLabel="label"
            optionValue="value"
            [required]="true"
          />
        </div>
      }

      <!-- Storage Name (auto-generated or editable) -->
      <base-form-field
        type="text"
        label="labels.storage_name"
        [control]="locationForm.controls.location_code"
        [required]="true"
        placeholder="preferences.location.storage_name_placeholder"
      />

      <!-- Is Active (only in edit mode) -->
      @if (location()) {
        <div class="flex items-center gap-2">
          <p-toggleswitch [formControl]="locationForm.controls.is_active" />
          <span class="text-sm">
            {{ 'preferences.location.is_active' | translate }}
          </span>
        </div>
      }
    </div>
  </div>
</base-dialog>
