@if (state.selectedMeshId()) {
  <div id="selection-panel" class="properties-panel glass-panel">

    <!-- ── Name ─────────────────────────────────────────────────────── -->
    <h3 class="panel-title">Selected Item</h3>

    <div class="form-group">
      <label class="form-label" for="prop3d-name">Name</label>
      <input id="prop3d-name" type="text" class="form-input"
        [ngModel]="state.selectedMeshName()"
        (ngModelChange)="updateName($event)" />
    </div>

    <!-- ── Transform (position / size / rotation) ────────────────────── -->
    @if (state.selectedMeshTransform(); as t) {

      <!-- Position -->
      <div class="form-group">
        <label class="form-label" for="prop3d-pos-x-ft">Position</label>
        <div class="dimension-row">
          <span class="axis-label">X (L/R)</span>
          <input id="prop3d-pos-x-ft" type="number" class="dim-input" [ngModel]="getFt(t.px)" (ngModelChange)="updateFtIn('position', 'x', $event, getIn(t.px))" /><span class="unit">'</span>
          <input type="number" step="0.5" class="dim-input" [ngModel]="getIn(t.px)" (ngModelChange)="updateFtIn('position', 'x', getFt(t.px), $event)" /><span class="unit">"</span>
        </div>
        <div class="dimension-row">
          <span class="axis-label">Y (U/D)</span>
          <input type="number" class="dim-input" [ngModel]="getFt(t.py)" (ngModelChange)="updateFtIn('position', 'y', $event, getIn(t.py))" /><span class="unit">'</span>
          <input type="number" step="0.5" class="dim-input" [ngModel]="getIn(t.py)" (ngModelChange)="updateFtIn('position', 'y', getFt(t.py), $event)" /><span class="unit">"</span>
        </div>
        <div class="dimension-row">
          <span class="axis-label">Z (F/B)</span>
          <input type="number" class="dim-input" [ngModel]="getFt(t.pz)" (ngModelChange)="updateFtIn('position', 'z', $event, getIn(t.pz))" /><span class="unit">'</span>
          <input type="number" step="0.5" class="dim-input" [ngModel]="getIn(t.pz)" (ngModelChange)="updateFtIn('position', 'z', getFt(t.pz), $event)" /><span class="unit">"</span>
        </div>
      </div>

      <!-- Size / Scale -->
      <div class="form-group">
        <label class="form-label" for="prop3d-size-x-ft">Size / Scale</label>
        <div class="dimension-row">
          <span class="axis-label">Width (X)</span>
          <input id="prop3d-size-x-ft" type="number" min="0" class="dim-input" [ngModel]="getFt(t.sx)" (ngModelChange)="updateFtIn('scaling', 'x', $event, getIn(t.sx))" /><span class="unit">'</span>
          <input type="number" min="0" step="0.5" max="11.5" class="dim-input" [ngModel]="getIn(t.sx)" (ngModelChange)="updateFtIn('scaling', 'x', getFt(t.sx), $event)" /><span class="unit">"</span>
        </div>
        <div class="dimension-row">
          <span class="axis-label">Height (Y)</span>
          <input type="number" min="0" class="dim-input" [ngModel]="getFt(t.sy)" (ngModelChange)="updateFtIn('scaling', 'y', $event, getIn(t.sy))" /><span class="unit">'</span>
          <input type="number" min="0" step="0.5" max="11.5" class="dim-input" [ngModel]="getIn(t.sy)" (ngModelChange)="updateFtIn('scaling', 'y', getFt(t.sy), $event)" /><span class="unit">"</span>
        </div>
        <div class="dimension-row">
          <span class="axis-label">Depth (Z)</span>
          <input type="number" min="0" class="dim-input" [ngModel]="getFt(t.sz)" (ngModelChange)="updateFtIn('scaling', 'z', $event, getIn(t.sz))" /><span class="unit">'</span>
          <input type="number" min="0" step="0.5" max="11.5" class="dim-input" [ngModel]="getIn(t.sz)" (ngModelChange)="updateFtIn('scaling', 'z', getFt(t.sz), $event)" /><span class="unit">"</span>
        </div>
      </div>

      <!-- Rotation -->
      <div class="form-group">
        <label class="form-label" for="prop3d-rot-x">Rotation (Degrees)</label>
        <div class="input-group">
          <input id="prop3d-rot-x" type="number" step="1" placeholder="X" class="rot-input" [ngModel]="getDeg(t.rx)" (ngModelChange)="updateDeg('x', $event)" />
          <input type="number" step="1" placeholder="Y" class="rot-input" [ngModel]="getDeg(t.ry)" (ngModelChange)="updateDeg('y', $event)" />
          <input type="number" step="1" placeholder="Z" class="rot-input" [ngModel]="getDeg(t.rz)" (ngModelChange)="updateDeg('z', $event)" />
        </div>
      </div>

    }<!-- /@if transform -->

    <!-- ── Actions ────────────────────────────────────────────────────── -->
    <div class="action-row">
      <button id="btn-3d-duplicate" class="btn-primary" (click)="action('duplicate')">Duplicate</button>
      <button id="btn-3d-delete"    class="btn-danger"  (click)="action('delete')">Delete</button>
    </div>

  </div>
}<!-- /@if selectedMeshId -->
