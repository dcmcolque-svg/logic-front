<!--
  While the product workspace is open (create/edit product, manage categories)
  the dialog swaps its header, hides the SKU columns and drops its own footer:
  the workspace brings its own Back / Cancel / Save actions.
  The header X (and Escape) stay available in every step and close the whole dialog.
-->
<base-dialog
  [visible]="visible()"
  [header]="dialogHeader()"
  [size]="workspaceOpen() ? 'lg' : 'xl'"
  [showSave]="!workspaceOpen()"
  [showCancel]="!workspaceOpen()"
  [dismissableMask]="false"
  [loading]="saving()"
  [saveDisabled]="!isValid()"
  (save)="onSave()"
  (hide)="onHide()"
>
  <!-- ═══════ SKU Section (main content) ═══════ -->
  <div class="grid grid-cols-12 gap-8">
    <!-- Left column: General Info / Center column: Dimensions, Weight, Cost & Price, Custom Attributes -->
    <app-sku-fields-columns [form]="skuForm" [attributes]="customAttrs" [hideColumns]="workspaceOpen()" [dense]="true">
      <base-form-field
        type="dropdown"
        label="labels.company"
        [control]="companyControl"
        [options]="companyOptions()"
        optionLabel="label"
        optionValue="value"
        [required]="true"
      />
    </app-sku-fields-columns>

    <!-- Right column: Product group + Images -->
    <div class="flex flex-col gap-6" [class]="workspaceOpen() ? 'col-span-12' : 'col-span-12 md:col-span-4'">
      <!-- Product group (optional) — rebuilt on every open so its state starts clean -->
      @if (visible()) {
        <app-product-workspace
          [companyId]="companyId()"
          [initialProduct]="preselectedProduct()"
          [locked]="!!preselectedProduct()"
          (productChange)="onProductChange($event)"
          (workspaceChange)="onWorkspaceChange($event)"
          (editingChange)="onProductEditing($event)"
        />
      }

      <!-- TODO: carga de imágenes deshabilitada temporalmente

        <div class="flex items-center gap-2 mb-1">
          <i class="pi pi-images text-primary text-sm"></i>
          <span class="font-semibold text-primary text-sm">
            {{ 'labels.images' | translate }}
          </span>
        </div>

  </div>
</base-dialog>
