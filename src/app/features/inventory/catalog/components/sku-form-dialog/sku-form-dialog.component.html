<!--
  While the product workspace is open (create/edit product, manage categories)
  the dialog swaps its header, hides the SKU columns and drops its own footer:
  the workspace brings its own Back / Cancel / Save actions.
  The header X (and Escape) stay available in every step and close the whole dialog.
-->
<base-dialog
  [visible]="visible()"
  [header]="dialogHeader"

  [size]="workspaceOpen() ? 'lg' : 'xl'"
  [showSave]="!workspaceOpen()"
  [showCancel]="!workspaceOpen()"
  [dismissableMask]="false"
  [loading]="saving()"
  [saveDisabled]="!canSave()"
  (save)="onSave()"
  (hide)="onHide()"
>
  <div class="grid grid-cols-12 gap-4">

    <!-- ── Left column: General Information / Center column: Dimensions, Weight, Cost & Price, Custom Attrs ── -->
    <app-sku-fields-columns
      [form]="skuForm"
      [attributes]="customAttrs"
      [hideColumns]="workspaceOpen()"
      skuPlaceholder="labels.sku_placeholder"
    >
      <base-form-field
        type="dropdown"
        label="labels.company"
        [control]="companyControl"
        [options]="companyOptions()"
        optionLabel="label"
        optionValue="value"
    
      />
    </app-sku-fields-columns>

    <!-- ── Right column: Product group + Images ──────────── -->
    <div class="flex flex-col gap-6" [class]="workspaceOpen() ? 'col-span-12' : 'col-span-12 md:col-span-4'">

      <!-- Product group (optional) — rebuilt on every open so its state starts clean -->
      @if (visible() && sku(); as row) {
        <app-product-workspace
          [companyId]="row.company_id"
          [initialProduct]="initialProduct()"
          (productChange)="onProductChange($event)"
          (workspaceChange)="onWorkspaceChange($event)"
          (editingChange)="onProductEditing($event)"
        />
      }

      <div class="flex flex-col gap-4" [style.display]="workspaceOpen() ? 'none' : null">

        <!-- TODO: carga de imágenes deshabilitada temporalmente
        <div class="flex items-center gap-2 mb-1">
          <i class="pi pi-images text-primary"></i>
          <span class="font-semibold text-primary">
            {{ 'labels.images' | translate }}
          </span>
        </div>

        Upload button + drop zone hint
        <div class="flex items-stretch gap-3">
          <p-fileUpload
            #imageUpload
            class="shrink-0"
            mode="basic"
            accept="image/*"
            [customUpload]="true"
            [auto]="true"
            chooseIcon="pi pi-upload"
            [chooseLabel]="'labels.upload' | translate"
            (onSelect)="onImageSelected($event)"
          />
          <div class="flex flex-1 min-w-0 items-center justify-center gap-2 px-3 rounded-lg border border-dashed border-surface-300 dark:border-surface-600 text-surface-400 text-sm">
            <i class="pi pi-cloud-upload"></i>
            <span>{{ 'labels.drag_file_here' | translate }}</span>
          </div>
        </div>

        Existing images (edit mode)
        @for (img of skuImages(); track img; let i = $index) {
          <div class="flex items-center gap-3 p-2 rounded-lg border border-surface-200 bg-surface-50 dark:bg-surface-800">
            <input
              type="radio"
              name="primaryImage"
              [checked]="i === 0"
              (change)="setImageAsPrimary(i)"
              class="cursor-pointer"
            />
            <img
              [src]="img"
              alt="SKU"
              class="w-12 h-12 object-cover rounded"
            />
            <span class="text-sm flex-1" [class.font-semibold]="i === 0">
              {{ i === 0 ? ('labels.main_image' | translate) : ('labels.image' | translate) + ' ' + (i + 1) }}
            </span>
            <button
              pButton
              icon="pi pi-trash"
              class="p-button-sm p-button-text p-button-danger"
              (click)="removeExistingImage(i)"
              type="button"
              aria-label="Remove"
            ></button>
          </div>
        }

        Pending images (not yet uploaded)
        @for (preview of pendingPreviews(); track preview; let i = $index) {
          <div class="flex items-center gap-3 p-2 rounded-lg border border-primary-200 bg-primary-50 dark:bg-surface-800">
            <i class="pi pi-spin pi-spinner text-primary" style="font-size: 0.75rem"></i>
            <img
              [src]="preview"
              alt="Pending upload"
              class="w-12 h-12 object-cover rounded"
            />
            <span class="text-sm text-surface-500 flex-1">
              {{ 'labels.pending_upload' | translate }}
            </span>
            <button
              pButton
              icon="pi pi-times"
              class="p-button-sm p-button-text p-button-secondary"
              (click)="removePendingImage(i)"
              type="button"
              aria-label="Remove"
            ></button>
          </div>
        }
        -->

        <!-- Edit-mode info box: SKU code is immutable -->
        @if (sku()) {
          <div
            class="flex items-center gap-3 p-3 rounded-lg border border-surface-200 bg-surface-50 dark:bg-surface-800 mt-auto"
          >
            <i class="pi pi-info-circle text-muted-color text-lg"></i>
            <div class="flex flex-col gap-1">
              <span class="text-sm text-muted-color">
                {{ 'labels.sku' | translate }}
              </span>
              <span class="font-semibold font-mono text-primary text-base">
                {{ sku()!.sku }}
              </span>
            </div>
          </div>
        }

      </div>
    </div>
  </div>
</base-dialog>
