<p-dialog
  [header]="translatedTitle()"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [closeOnEscape]="true"
  [dismissableMask]="true"
  [style]="{ width: '28rem' }"
  [breakpoints]="{ '768px': '90vw' }"
  appendTo="body"
>
  <div class="flex flex-col items-center gap-4 py-4">
    <!-- Severity icon -->
    <div
      class="flex items-center justify-center rounded-full"
      [ngClass]="iconContainerClass()"
      style="width: 4rem; height: 4rem"
    >
      <i [class]="iconClass()" style="font-size: 2rem"></i>
    </div>

    <!-- Message -->
    <p class="text-center text-surface-600 dark:text-surface-300 mx-4">
      {{ message() | translate }}
    </p>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-center gap-3">
      <p-button
        [label]="cancelLabel() | translate"
        severity="secondary"
        [outlined]="true"
        (onClick)="hide.emit()"
        icon="pi pi-times"
      />
      <p-button
        [label]="confirmLabel() | translate"
        [severity]="severity()"
        [loading]="loading()"
        (onClick)="confirm.emit()"
        [icon]="confirmIcon()"
      />
    </div>
  </ng-template>
</p-dialog>
