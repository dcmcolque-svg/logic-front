<p-dialog
  [header]="translatedTitle()"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [closeOnEscape]="true"
  [dismissableMask]="true"
  [style]="{ width: '28rem' }"
  [breakpoints]="{ '768px': '90vw' }"
  appendTo="body"
>
  <div class="flex flex-col items-center gap-4 py-4">
    <!-- Severity icon -->
    <div
      class="flex items-center justify-center rounded-full"
      [ngClass]="iconContainerClass()"
      style="width: 4rem; height: 4rem"
    >
      <i [class]="iconClass()" style="font-size: 2rem"></i>
    </div>

    <!-- Subject (optional) + message -->
    <div class="text-center mx-4">
      @if (subject()) {
        <p class="mt-0 mb-2 font-semibold text-surface-900 dark:text-surface-0">{{ subject() }}</p>
      }
      <p class="m-0 text-surface-600 dark:text-surface-300">
        {{ message() | translate: messageParams() }}
      </p>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-center gap-3">
      @if (showCancel()) {
        <p-button
          [label]="cancelLabel() | translate"
          severity="secondary"
          [outlined]="true"
          (onClick)="hide.emit()"
          icon="pi pi-times"
        />
      }
      <p-button
        [label]="confirmLabel() | translate"
        [severity]="severity()"
        [loading]="loading()"
        (onClick)="confirm.emit()"
        [icon]="confirmIcon()"
      />
    </div>
  </ng-template>
</p-dialog>
