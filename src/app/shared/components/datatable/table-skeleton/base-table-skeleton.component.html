<div class="animate-fadein">
  <!-- Toolbar skeleton -->
  <div class="flex justify-between items-center mb-4">
    <p-skeleton width="15rem" height="2.5rem" />
    <div class="flex gap-2">
      <p-skeleton width="8rem" height="2.5rem" />
      <p-skeleton width="2.5rem" height="2.5rem" borderRadius="50%" />
    </div>
  </div>
  <!-- Table skeleton -->
  <div class="rounded-border border border-surface overflow-hidden">
    <!-- Header -->
    <div class="flex gap-0 bg-surface-50 dark:bg-surface-800 p-3">
      @if (selectable()) {
        <div style="width: 3rem; flex-shrink: 0">
          <p-skeleton width="1.25rem" height="1.25rem" />
        </div>
      }
      @for (_ of colArray(); track $index) {
        <div class="flex-1 px-2">
          <p-skeleton width="70%" height="1rem" />
        </div>
      }
    </div>
    <!-- Rows -->
    @for (_ of rowArray(); track $index) {
      <div class="flex gap-0 p-3 border-t border-surface">
        @if (selectable()) {
          <div style="width: 3rem; flex-shrink: 0">
            <p-skeleton width="1.25rem" height="1.25rem" />
          </div>
        }
        @for (_ of colArray(); track $index) {
          <div class="flex-1 px-2">
            <p-skeleton width="{{ 50 + $index * 10 }}%" height="1rem" />
          </div>
        }
      </div>
    }
  </div>
  <!-- Paginator skeleton -->
  <div class="flex justify-between items-center mt-3">
    <p-skeleton width="10rem" height="1rem" />
    <div class="flex gap-1">
      @for (_ of [1, 2, 3, 4, 5]; track $index) {
        <p-skeleton width="2rem" height="2rem" />
      }
    </div>
  </div>
</div>
