@if (visible()) {
  <div
    class="base-loading-overlay animate-fadein"
    [class.base-loading-overlay--fullscreen]="fullscreen()"
  >
    <p-progress-spinner
      [style]="{ width: '3rem', height: '3rem' }"
      strokeWidth="4"
      animationDuration=".8s"
    />
    @if (message()) {
      <span class="mt-3 text-sm text-surface-500">{{ message() }}</span>
    }
  </div>
}
