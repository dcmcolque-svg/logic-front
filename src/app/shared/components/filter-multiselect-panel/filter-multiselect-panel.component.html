<p-multiSelect
  #ms
  [options]="options()"
  [ngModel]="pendingValue()"
  (ngModelChange)="onPendingChange($event)"
  [optionLabel]="optionLabel()"
  [optionValue]="optionValue()"
  [placeholder]="placeholder()"
  [display]="display()"
  [filter]="showFilter()"
  [showClear]="false"
  [maxSelectedLabels]="maxSelectedLabels()"
  [selectedItemsLabel]="'{0} ' + ('labels.records' | translate)"
  [styleClass]="(value().length > 0 ? 'filter-active ' : '') + styleClass()"
  appendTo="body"
>
  <!-- Custom item template with colored dot (when colorMap is provided) -->
  <ng-template pTemplate="item" let-option>
    <div class="flex items-center gap-2">
      @if (getOptionColor(option[optionValue()])) {
        <span
          class="color-dot"
          [style.background-color]="getOptionColor(option[optionValue()])"
        ></span>
      }
      <span>{{ option[optionLabel()] }}</span>
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <div class="filter-panel-footer">
      <p-button
        [label]="'buttons.clear' | translate"
        icon="pi pi-times"
        severity="secondary"
        [outlined]="true"
        size="small"
        (onClick)="onClear()"
      />
      <p-button
        [label]="'buttons.apply' | translate"
        icon="pi pi-check"
        size="small"
        (onClick)="onApply()"
      />
    </div>
  </ng-template>
</p-multiSelect>
